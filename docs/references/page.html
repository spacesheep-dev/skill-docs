<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Document</title>
<meta name="docs-ledger" content="">
<style>
:root {
  --paper: #fdfcfa; --ink: #1d1c1a; --soft: #5e5a54; --rule: #e4e0d9; --link: #2453a6; --todo: #9a948b;
  --body: "Iowan Old Style", "Charter", "Georgia", "Times New Roman", serif;
  --head: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #191816; --ink: #ece8e1; --soft: #aaa399; --rule: #34312c; --link: #8fb1ff; --todo: #77716a; }
}
* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 18px/1.6 var(--body); }
main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
h1, h2, h3 { font-family: var(--head); line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: 2rem; margin: 0 0 1rem; }
h2 { font-size: 1.25rem; margin: 2.25rem 0 0.5rem; }
h3 { font-size: 1.05rem; margin: 1.5rem 0 0.25rem; }
p, ul, ol, blockquote { margin: 0 0 1rem; }
ul, ol { padding-left: 1.4rem; }
li { margin: 0.25rem 0; }
blockquote { border-left: 3px solid var(--rule); padding-left: 1rem; color: var(--soft); }
a { color: var(--link); }
section[data-ss-id="d-s0"] p { font-size: 1.1rem; color: var(--soft); }
.todo:empty::before { content: "Writing…"; color: var(--todo); font-style: italic; }
@media (max-width: 480px) { body { font-size: 17px; } main { padding-top: 2rem; } h1 { font-size: 1.6rem; } }
@page { size: A4; margin: 16mm 18mm; }
@media print {
  html { background: #fff; color: #000; }
  body { font-size: 11pt; line-height: 1.4; }
  main { max-width: none; padding: 0; }
  h1 { font-size: 17pt; margin: 0 0 8pt; }
  h2 { font-size: 12.5pt; margin: 12pt 0 3pt; break-after: avoid; }
  h3 { font-size: 11pt; margin: 8pt 0 2pt; break-after: avoid; }
  p, ul, ol, blockquote { margin: 0 0 6pt; }
  section[data-ss-id="d-s0"] p { font-size: 11.5pt; color: #333; }
  a { color: inherit; }
}
</style>
</head>
<body>
<main data-ss-id="d-doc">
</main>
</body>
</html>
