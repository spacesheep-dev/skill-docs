:root {
  --ss-font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ss-font-logo: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body { font-family: var(--ss-font-sans); }
button, input, select, textarea { font-family: inherit; }
:root{color-scheme:light dark;--g:#fafafa;--ink:#1a1a1f;--soft:#55555f;--mute:#5c5c68;--dot:#5a5ae6;--step:#4040c0;--card:#fff;--line:#e8e6e2;--warn:#93370d;--sky:#eaeaf8;--cloud:rgba(26,26,31,.09)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--g);color:var(--ink);font:17px/1.5 var(--ss-font-sans)}
main{width:100%;padding:24px 0 48px;text-align:center}
.ll-sky{position:relative;height:200px;max-width:720px;margin:0 auto 26px;overflow:hidden;container-type:inline-size;background:linear-gradient(180deg,transparent 0,var(--sky) 22%,var(--g) 100%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ll-cloud{position:absolute;left:0;height:12px;background:var(--cloud);opacity:0;animation:ll-drift 3.2s linear infinite}
.ll-cloud::before,.ll-cloud::after{content:"";position:absolute;top:-12px;height:12px;background:inherit}
.ll-cloud::before{left:12px;width:24px}
.ll-cloud::after{left:48px;width:12px}
.ll-c1{top:44px;width:84px;animation-duration:2.6s;--x:68cqw}
.ll-c2{top:120px;width:60px;animation-duration:3.6s;animation-delay:-1.4s;--x:14cqw}
.ll-c3{top:168px;width:96px;animation-duration:2.2s;animation-delay:-.8s;--x:40cqw}
.ll-c4{top:78px;width:48px;animation-duration:4.2s;animation-delay:-2.6s;--x:84cqw}
.ll-sheep{position:absolute;left:50%;top:50%;margin:-46px 0 0 -56px;animation:ll-fly 1.35s ease-in-out infinite}
.ll-sheep svg{display:block;height:92px;width:auto}
.ss-wool{fill:#fff}
.ll-body{max-width:560px;margin:0 auto;padding:0 clamp(16px,5vw,32px)}
h1{font-size:clamp(26px,4vw,30px);line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
.ll-what{font-size:18px;font-weight:600;margin:0;overflow-wrap:anywhere}
.ll-desc{color:var(--soft);font-size:15.5px;margin:4px auto 0;max-width:400px;overflow-wrap:anywhere}
.ll-note{color:var(--mute);font-size:15px;margin:22px 0 0}
[hidden]{display:none!important}
.ll-step{margin:22px 0 0;color:var(--step);font-weight:600;font-size:16.5px;overflow-wrap:anywhere;text-wrap:balance}
.ll-dots{display:inline-flex;gap:4px;margin-right:10px;vertical-align:middle}
.ll-dots i{width:6px;height:6px;border-radius:50%;background:var(--dot);animation:ll-walk 1.2s ease-in-out infinite}
.ll-dots i:nth-child(2){animation-delay:.15s}
.ll-dots i:nth-child(3){animation-delay:.3s}
.ll-log{margin:14px auto 0;max-width:400px}
.ll-pill{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;max-width:100%}
.ll-meta.ll-pill{margin:14px 0 0}
.ll-log summary{list-style:none;cursor:pointer}
.ll-log summary::-webkit-details-marker{display:none}
.ll-log summary:focus-visible{outline:2px solid var(--dot);outline-offset:2px}
.ll-log-sum{display:inline-flex;align-items:center;gap:10px;min-width:0}
.ll-sum-text{overflow-wrap:anywhere;text-align:left}
.ll-chev{transition:transform .2s}
.ll-log[open] .ll-chev{transform:rotate(180deg)}
.ll-blocks{display:inline-flex;gap:3px;flex:none}
.ll-fl{display:block;width:12px;height:12px;flex:none}
.ll-y{background:#ffdf01}.ll-a{background:#fea900}.ll-o{background:#fe7700}.ll-r{background:#ed5544}
.ll-steps{list-style:none;margin:12px 0 0;padding:6px 0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px}
.ll-steps li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:8px 16px;font-size:15px;color:var(--mute)}
.ll-steps-text{overflow-wrap:anywhere}
.ll-steps-time{font-variant-numeric:tabular-nums;font-size:13px}
.is-quiet .ll-step{color:var(--warn)}
.is-stopped .ll-step{color:var(--ink)}
.is-quiet .ll-dots,.is-stopped .ll-dots{display:none}
.is-quiet .ll-sheep,.is-stopped .ll-sheep{animation:none}
.is-quiet .ll-cloud,.is-stopped .ll-cloud{animation-play-state:paused}
@keyframes ll-fly{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(8px,-12px) rotate(3deg)}}
@keyframes ll-drift{0%{transform:translateX(calc(100cqw - 40px));opacity:0}18%{opacity:1}72%{opacity:1}100%{transform:translateX(-20px);opacity:0}}
@keyframes ll-walk{0%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}80%{opacity:.25;transform:translateY(0)}100%{opacity:.25;transform:translateY(0)}}
@keyframes ll-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.ll-sheep{animation:ll-pulse 1.8s ease-in-out infinite}.ll-dots i{animation:ll-pulse 2s ease-in-out infinite}.ll-cloud{animation:none;opacity:1;transform:translateX(var(--x))}.ll-chev{transition:none}}
@media (prefers-color-scheme:dark){
:root{--g:#1c2028;--ink:#f2f4f8;--soft:#c6ccd8;--mute:#a2aab8;--dot:#8c6aff;--step:#b39dff;--card:#252a34;--line:#323846;--warn:#fdb022;--sky:#27273e;--cloud:rgba(242,244,248,.09)}
.ll-sheep svg{filter:drop-shadow(0 0 3px #b39dff) drop-shadow(0 0 8px rgba(179,157,255,.85))}
.ll-sheep .ss-ink,.ll-sheep .ss-ink-legs{fill:#0b0c10}
}

t x="33.08" y="88.16" width="19.99" height="19.99" style="fill:#ffdf01;"/><rect x="93.04" y="128.13" width="19.99" height="19.99" style="fill:#ed5544;"/><rect x="73.06" y="128.13" width="19.99" height="19.99" style="fill:#fe7700;"/><rect x="53.07" y="148.12" width="19.99" height="19.99" style="fill:#feed87;"/><rect x="93.04" y="108.15" width="19.99" height="19.99" style="fill:#fea900;"/><rect x="73.06" y="148.12" width="19.99" height="19.99" style="fill:#ffdf01;"/><rect x="13.09" y="128.13" width="19.99" height="19.99" style="fill:#ffdf01;"/><rect x="53.07" y="128.13" width="19.99" height="19.99" style="fill:#fea900;"/><rect x="33.08" y="128.13" width="19.99" height="19.99" style="fill:#fea900;"/><rect x="93.04" y="168.11" width="19.99" height="19.99" style="fill:#ed5544;"/><rect x="73.06" y="88.16" width="19.99" height="19.99" style="fill:#fe7700;"/><rect x="53.07" y="188.1" width="19.99" height="19.99" style="fill:#feed87;"/><rect x="73.06" y="68.17" width="19.99" height="19.99" style="fill:#feed87;"/><rect x="93.04" y="148.12" width="19.99" height="19.99" style="fill:#fea900;"/><rect x="73.06" y="108.15" width="19.99" height="19.99" style="fill:#ffdf01;"/><rect x="33.08" y="168.11" width="19.99" height="19.99" style="fill:#ffdf01;"/><rect x="73.06" y="168.11" width="19.99" height="19.99" style="fill:#fea900;"/><rect x="93.04" y="208.08" width="19.99" height="19.99" style="fill:#ed5544;"/><rect x="93.04" y="188.1" width="19.99" height="19.99" style="fill:#fea900;"/></svg></div></div>
<div class="ll-body">
<h1 data-ss-id="working" data-ss-react="off">Spacesheep is working on it</h1>
<p class="ll-what" data-ss-id="what" data-ss-react="off">Second &lt;probe&gt; &amp; B</p>

<p class="ll-note" data-ss-id="note" data-ss-react="off">The finished page will appear right here, at this same link.</p>
<p class="ll-step" role="status" aria-live="polite" hidden><span class="ll-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="ll-step-text"></span></p>
<details class="ll-log" hidden><summary class="ll-pill"><span class="ll-log-sum"></span><span class="ll-chev" aria-hidden="true">▾</span></summary><ol class="ll-steps" aria-label="Done so far"></ol></details>

<script>(function(){
var main=document.querySelector("[data-ss-work]");if(!main)return;
function q(s){return main.querySelector(s)}
var h1=q("h1"),note=q(".ll-note"),step=q(".ll-step"),txt=q(".ll-step-text"),log=q(".ll-log"),sum=q(".ll-log-sum"),list=q(".ll-steps"),meta=q(".ll-meta");
var QUIET=6e5,FLAME=["y","a","o","r"],st=null,start=0,last=0,tick=null;
function clock(ms){var s=Math.max(0,Math.floor(ms/1e3)),m=Math.floor(s/60);return m>=60?Math.floor(m/60)+"h "+(m%60)+"m":m+":"+(s%60<10?"0":"")+(s%60)}
function ago(ms){var m=Math.max(1,Math.round(ms/6e4));return m<60?m+" min":Math.round(m/60)+" h"}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function flame(i){return el("i","ll-fl ll-"+FLAME[i%4])}
function fill(into,n,words){into.textContent="";if(n){var b=el("span","ll-blocks");for(var i=0;i<Math.min(n,6);i++)b.appendChild(flame(i));into.appendChild(b)}into.appendChild(el("span","ll-sum-text",words))}
function draw(){
list.textContent="";var n=st.steps.length;
for(var i=0;i<n;i++){var s=st.steps[i],li=el("li");li.appendChild(flame(n-1-i));li.appendChild(el("span","ll-steps-text",s.text));li.appendChild(el("span","ll-steps-time",clock(s.took)));list.appendChild(li)}
}
function paint(){
var on=!!st,now=Date.now();
note.hidden=on;step.hidden=!on;
var quiet=on&&!st.stopped&&now-last>QUIET;
main.classList.toggle("is-on",on);main.classList.toggle("is-stopped",on&&st.stopped);main.classList.toggle("is-quiet",quiet);
h1.textContent=on&&st.stopped?"Spacesheep stopped working on it":"Spacesheep is working on it";
if(!on){log.hidden=true;meta.hidden=true;return}
txt.textContent=quiet?"No update for "+ago(now-last)+" — it may have stopped.":st.text;
var n=st.done,count=n?n+(st.more?"+":"")+(n===1&&!st.more?" step":" steps")+" done":"",bits=[];
if(st.stopped){bits.push((st.who?st.who+" stopped":"Stopped")+" after "+clock(last-start));if(count)bits.push(count)}
else{if(count&&!quiet)bits.push(count);if(st.who)bits.push(st.who);bits.push(clock(now-start));if(quiet)bits.push("last: "+st.text)}
var listed=st.steps.length>0;
log.hidden=!listed;meta.hidden=listed;
fill(listed?sum:meta,n,bits.join(" · "));
}
document.addEventListener("ss:work",function(e){
var d=e.detail,now=Date.now();
if(d&&typeof d.text==="string"&&d.text){
var raw=Array.isArray(d.steps)?d.steps.slice(0,6):[],steps=[],prev=Math.max(0,+d.current||0);
for(var i=0;i<raw.length;i++){var r=raw[i];if(!r||typeof r.text!=="string"||!r.text)continue;var a=Math.max(prev,+r.ago||0);steps.push({text:r.text,took:a-prev});prev=a}
st={text:d.text,who:typeof d.who==="string"&&d.who?d.who:null,stopped:d.stopped===true,done:Math.max(steps.length,Math.floor(+d.done||0)),more:d.more===true,steps:steps};start=now-Math.max(0,+d.elapsed||0);last=now-Math.max(0,+d.quiet||0);
draw();
}
else st=null;
paint();
clearInterval(tick);tick=st&&!st.stopped?setInterval(paint,1e3):null;
});
})();</script>
